[package]
name = "rust_vm_core"
version = "0.1.0"
edition = "2021"
authors = ["Principal Systems Architect <systems@enterprise.dev>"]
description = "Deterministic zero-allocation Rust Native Virtual Machine and Python Bytecode Obfuscation Compute Nucleus"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.1", default-features = false, features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "2.16.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
napi-bindings = ["dep:napi", "dep:napi-derive"]

[dev-dependencies]
serde_json = "1.0"
